<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#ffd43b">
<title>מהיומן של גל</title>
<meta property="og:title" content="📔 מהיומן של גל">
<meta property="og:description" content="דף אחד מתוך היומן של גל">
<meta property="og:image" content="icons/icon-512.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playpen+Sans+Hebrew:wght@400;600;800&family=Rubik:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#2b2d42;--ink-soft:#5c5f7a;--paper:#fffdf5;--line:#dce8f3;--margin:#f6a5a5;
  --yellow:#ffe066;--pink:#ffa8c5;--mint:#8ce99a;--sky:#8fd3ff;--lilac:#c4b5fd;--orange:#ffc078;--desk:#fff3bf;
  --hand:'Playpen Sans Hebrew','Rubik',system-ui,sans-serif}
*{box-sizing:border-box}
body{margin:0;font-family:'Rubik',system-ui,sans-serif;color:var(--ink);background-color:var(--desk);
  background-image:radial-gradient(rgba(255,107,107,.18) 2px,transparent 2.5px),radial-gradient(rgba(77,171,247,.16) 2px,transparent 2.5px);
  background-size:38px 38px,38px 38px;background-position:0 0,19px 19px;padding:28px 16px 50px}
.wrap{max-width:680px;margin:0 auto}
.from{font-family:var(--hand);font-weight:800;font-size:24px;text-align:center;margin:0 0 18px}
.from span{background:linear-gradient(transparent 58%,var(--pink) 58%);padding:0 4px}
.page{position:relative;background:var(--paper);border:2.5px solid var(--ink);border-radius:18px;box-shadow:0 3px 0 rgba(43,45,66,.12),0 8px 22px rgba(43,45,66,.1);overflow:hidden}
.page::before{content:"";position:absolute;top:0;bottom:0;right:44px;width:2px;background:var(--margin);opacity:.8}
.head{height:16px;background:var(--c,var(--yellow));border-bottom:2.5px solid var(--ink)}
.inner{padding:24px 58px 28px 20px}
.badge{display:inline-flex;gap:4px;background:var(--c,var(--yellow));border:2px solid var(--ink);border-radius:999px;padding:1px 9px;font-weight:500;font-size:13px}
.when{color:var(--ink-soft);font-size:14px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
h1{font-family:var(--hand);font-weight:800;font-size:28px;margin:8px 0 4px;line-height:1.3}
.mood{position:absolute;top:26px;left:20px;font-size:40px}
.body{font-family:var(--hand);font-size:19px;line-height:34px;white-space:pre-wrap;margin-top:12px;
  background-image:linear-gradient(transparent 33px,var(--line) 33px,var(--line) 34px);background-size:100% 34px}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(150px,40%),1fr));gap:16px;margin-top:22px}
.polaroid{background:#fff;padding:6px 6px 18px;border:2px solid var(--ink);box-shadow:0 3px 8px rgba(0,0,0,.12);border-radius:4px;aspect-ratio:.86}
.polaroid:nth-child(3n+1){transform:rotate(-2deg)}.polaroid:nth-child(3n+2){transform:rotate(1.5deg)}
.polaroid img{width:100%;height:100%;object-fit:cover;display:block;border-radius:2px;background:#eee}
.state{text-align:center;font-family:var(--hand);font-size:20px;padding:60px 10px}
.state .big{font-size:60px}
@media (max-width:360px), (max-height:560px){
  body{padding:14px 10px 30px}
  .from{font-size:19px;margin-bottom:12px}
  .page{border-radius:14px;border-width:2px}
  .page::before{right:26px}
  .head{height:12px}
  .inner{padding:16px 36px 18px 10px}
  h1{font-size:21px;padding-left:34px}
  .mood{font-size:28px;top:18px;left:10px}
  .when{font-size:12px;gap:5px}
  .body{font-size:16px;line-height:30px;background-image:linear-gradient(transparent 29px,var(--line) 29px,var(--line) 30px);background-size:100% 30px}
  .gallery{gap:10px;margin-top:14px}
  .polaroid{padding:4px 4px 12px}
}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
</head>
<body>
<div class="wrap">
  <p class="from"><span>📔 מהיומן של גל</span></p>
  <div id="root"><div class="state">רגע, פותחים את הדף...</div></div>
</div>
<script>
const sb = supabase.createClient('https://mjeupkuecrbkswpvhjvl.supabase.co',
  'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1qZXVwa3VlY3Jia3N3cHZoanZsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQ0ODg1OTMsImV4cCI6MjExMDA2NDU5M30.ZRtNPUjrKInAWH-Wfr21RJ600pxY6K1JltlKnJT0SpU',
  { auth: { persistSession: false } });
const KINDS = { thought:['💭','מחשבה'], story:['📖','סיפור'], day:['☀️','היום שלי'], idea:['💡','רעיון'] };
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const root = document.getElementById('root');
const gone = () => root.innerHTML = '<div class="state"><div class="big">🔒</div>הדף הזה כבר לא משותף</div>';

(async () => {
  const slug = new URLSearchParams(location.search).get('s') || '';
  if (slug.length < 10) return gone();
  const { data, error } = await sb.rpc('get_shared_entry', { slug });
  const e = data?.[0];
  if (error || !e) return gone();
  let urls = [];
  if (e.photos.length) {
    const r = await sb.storage.from('photos').createSignedUrls(e.photos, 3600);
    urls = (r.data || []).map(x => x.signedUrl).filter(Boolean);
  }
  const [emoji, label] = KINDS[e.kind] || KINDS.thought;
  document.title = (e.title ? e.title + ' · ' : '') + 'מהיומן של גל';
  const day = new Date(e.entry_date + 'T12:00:00').toLocaleDateString('he-IL', { weekday:'long', day:'numeric', month:'long', year:'numeric' });
  root.innerHTML = `<article class="page" style="--c:var(--${e.color})"><div class="head"></div><div class="inner">
    ${e.mood ? `<div class="mood">${e.mood}</div>` : ''}
    <div class="when"><span class="badge">${emoji} ${label}</span> ${day}</div>
    ${e.title ? `<h1>${esc(e.title)}</h1>` : ''}
    ${e.body ? `<div class="body">${esc(e.body)}</div>` : ''}
    ${urls.length ? `<div class="gallery">${urls.map(u => `<div class="polaroid"><img src="${u}" alt=""></div>`).join('')}</div>` : ''}
  </div></article>`;
})();
</script>
</body>
</html>
